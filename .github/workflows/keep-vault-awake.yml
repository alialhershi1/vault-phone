name: Keep Vault cache worker awake

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake the Render service and trigger its background scan
        run: curl --fail --silent --show-error --max-time 60 https://vault-phone.onrender.com/health
