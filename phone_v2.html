<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101318"><title>Vault</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101318;color:#edf2f7}
*{box-sizing:border-box}body{margin:0;padding:22px;max-width:1050px;margin-inline:auto}
h1{font-size:25px;margin:0 0 5px}h2{font-size:18px;margin:0 0 12px}p{color:#aab4c0;margin:0}
.panel{background:#1b222c;border:1px solid #303b49;border-radius:14px;padding:17px;margin:15px 0}
input,button,select{font:inherit;border-radius:9px;padding:10px 12px;border:1px solid #465366;background:#111820;color:#fff}
input[type=password],input[type=search]{width:100%;margin:9px 0}
button{background:#2563eb;border:0;cursor:pointer;margin:4px 4px 4px 0}button:disabled{opacity:.45;cursor:not-allowed}
button.secondary{background:#354252}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item{padding:11px 3px;border-bottom:1px solid #303b49;display:flex;gap:12px;align-items:center;justify-content:space-between}
.item:last-child{border-bottom:0}.item-name{min-width:0;overflow-wrap:anywhere}.item-actions{flex-shrink:0}
small,.muted{color:#9eabb9}.hidden{display:none!important}
.yt-player{position:relative;background:#000;border-radius:12px;overflow:hidden;margin-top:12px}
#video{display:block;width:100%;max-height:68vh;background:#000;cursor:pointer}
.yt-controls{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.88));opacity:1;transition:opacity .2s}
.yt-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.yt-controls button{background:transparent;color:#fff;padding:5px 7px;margin:0;font-size:15px}
.yt-controls button:hover{background:#ffffff22}
.yt-controls input[type=range]{accent-color:#f00;padding:0;margin:0}
#seek{width:100%;height:4px;cursor:pointer;margin:0 0 9px}
#volume{width:75px}
#time{font-size:12px;color:#eee;white-space:nowrap}
#captions{max-width:170px;padding:5px;background:#171717;border:1px solid #555}
.yt-spacer{flex:1}
@media(max-width:520px){.yt-controls{padding:25px 7px 7px}.yt-row{gap:5px}#volume{width:48px}#captions{max-width:112px;font-size:12px}}
#status{white-space:pre-wrap;color:#93c5fd;margin-top:9px;min-height:1.3em}
.group{border:1px solid #303b49;border-radius:10px;margin:9px 0;overflow:hidden}
.group summary{padding:12px 13px;background:#151c25;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:12px}
.group-body{padding:0 12px}.count{color:#9eabb9;font-weight:400}
.player-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#playing{overflow-wrap:anywhere}.empty{padding:20px 5px;color:#9eabb9;text-align:center}
@media(max-width:600px){body{padding:13px}.panel{padding:13px}.item{align-items:flex-start}.item-actions button{padding:9px}}
</style></head><body>
<h1>Vault</h1><p>Your encrypted library, streamed from Discord.</p>
<section id="login" class="panel"><label for="password">Vault password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter the vault password"><button id="unlock">Unlock</button><div id="loginStatus" class="muted"></div></section>
<section id="app" class="hidden">
<div class="panel">
<div class="toolbar"><button id="refresh">Refresh library</button><button class="secondary" id="lock">Lock vault</button></div>
<div class="toolbar" style="margin-top:10px">
<label class="muted">Files <input id="files" type="file" multiple></label>
<label class="muted">Folders <input id="folders" type="file" webkitdirectory directory multiple></label>
<button id="upload">Upload selected</button>
</div><div id="status"></div>
</div>
<div id="library" class="panel"><div class="player-head"><h2>Library</h2><small id="total"></small></div><input id="search" type="search" placeholder="Search files and folders"><div id="items"></div></div>
<div class="panel">
<div class="player-head"><h2 id="playing">Player</h2><small id="queueLabel">No video selected</small></div>
<div class="yt-player" id="player">
<video id="video" playsinline preload="metadata"></video>
<div class="yt-controls">
<input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
<div class="yt-row">
<button id="playPause" aria-label="Play or pause">▶</button>
<button id="mute" aria-label="Mute">🔊</button><input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
<span id="time">0:00 / 0:00</span><span class="yt-spacer"></span>
<label class="muted" style="font-size:12px">CC <select id="captions"><option value="">Off</option></select></label>
<label class="muted" style="font-size:12px">Speed <select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option></select></label>
<button id="previous" disabled title="Previous video">⏮</button><button id="next" disabled title="Next video">⏭</button>
<button id="fullscreen" title="Fullscreen">⛶</button>
</div></div></div>
</div>
</section>
<script>
let token="",pollTimer=null,loading=false,allItems=[],playQueue=[],currentIndex=-1;
const $=id=>document.getElementById(id);
function auth(url){return url+(url.includes("?")?"&":"?")+"t="+encodeURIComponent(token)}
async function api(url,opts={}){const r=await fetch(url,opts);if(!r.ok)throw new Error((await r.text())||("Request failed: "+r.status));return r}
function say(s){$("status").textContent=s}
function loginSay(s){$("loginStatus").textContent=s}
function folderName(f){return (f.folder||"").replace(/^\/+|\/+$/g,"")||"Unsorted"}
function isVideo(f){return (f.type||"").startsWith("video/")||/\.(mp4|m4v|webm|mov|mkv|avi|ogv)$/i.test(f.name||"")}
function formatSize(n){n=Number(n)||0;if(n<1024*1024)return (n/1024).toFixed(0)+" KB";return (n/1048576).toFixed(1)+" MB"}
function baseName(name){return (name||"").replace(/\\.[^.]+$/,"").toLowerCase()}
function isSrt(f){return /\\.srt$/i.test(f.name||"")}
function srtToVtt(s){
 s=s.replace(/^\\uFEFF/,"").replace(/\\r/g,"").trim();
 return "WEBVTT\\n\\n"+s.replace(/^(\\d+)\\s*\\n/gm,"").replace(/(\\d{2}:\\d{2}:\\d{2}),(\\d{3})/g,"$1.$2").replace(/\\n{3,}/g,"\\n\\n");
}
async function setSubtitle(fid){
 const v=$("video");for(const t of [...v.querySelectorAll("track")])t.remove();
 if(!fid){$("captions").value="";return}
 try{
  const r=await fetch(auth("/api/stream/"+encodeURIComponent(fid)));if(!r.ok)throw new Error("Subtitle file unavailable");
  const vtt=srtToVtt(await r.text());const blob=new Blob([vtt],{type:"text/vtt"});const url=URL.createObjectURL(blob);
  const track=document.createElement("track");track.kind="subtitles";track.label="Subtitles";track.srclang="en";track.src=url;track.default=true;v.append(track);
  track.addEventListener("load",()=>{if(v.textTracks.length)v.textTracks[0].mode="showing"});
  setTimeout(()=>{if(v.textTracks.length)v.textTracks[0].mode="showing"},250);
  $("captions").value=fid;
 }catch(e){say("Could not load subtitles: "+e.message)}
}
function populateSubtitles(video){
 const sel=$("captions");sel.innerHTML='<option value="">Off</option>';
 const srts=allItems.filter(x=>x.ok&&isSrt(x));
 const matching=srts.filter(x=>baseName(x.name)===baseName(video.name));
 const options=matching.length?matching:srts;
 for(const f of options){const o=document.createElement("option");o.value=f.id;o.textContent=f.name;sel.append(o)}
 sel.disabled=!options.length;
 if(matching.length===1)setSubtitle(matching[0].id);else setSubtitle("");
}
function fmtTime(s){if(!Number.isFinite(s))return "0:00";const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=Math.floor(s%60);return h?h+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0"):m+":"+String(sec).padStart(2,"0")}
function syncControls(){
 const v=$("video"),d=v.duration||0,t=v.currentTime||0;
 $("seek").value=d?Math.round(t/d*1000):0;$("time").textContent=fmtTime(t)+" / "+fmtTime(d);
 $("playPause").textContent=v.paused?"▶":"❚❚";$("mute").textContent=(v.muted||v.volume===0)?"🔇":"🔊";
}
function playAt(index){
 if(index<0||index>=playQueue.length)return;
 currentIndex=index;const f=playQueue[index];$("playing").textContent=f.name;$("queueLabel").textContent=(index+1)+" / "+playQueue.length;
 const v=$("video");v.pause();v.querySelectorAll("track").forEach(t=>t.remove());
 v.src=auth("/api/stream/"+encodeURIComponent(f.id));v.load();populateSubtitles(f);v.play().catch(()=>{});
 $("previous").disabled=index===0;$("next").disabled=index>=playQueue.length-1;syncControls();
}
function moveQueue(delta){const n=currentIndex+delta;if(n>=0&&n<playQueue.length)playAt(n)}
function render(){
 const q=$("search").value.trim().toLowerCase();
 const filtered=allItems.filter(f=>(f.name+" "+folderName(f)).toLowerCase().includes(q));
 const groups=new Map();
 for(const f of filtered){const key=folderName(f);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(f)}
 $("items").innerHTML="";$("total").textContent=filtered.length+" of "+allItems.length+" files";
 if(!filtered.length){$("items").innerHTML='<div class="empty">No matching files.</div>';return}
 for(const [folder,items] of groups){
  const details=document.createElement("details");details.className="group";details.open=!!q||folder==="Unsorted";
  const summary=document.createElement("summary");const label=document.createElement("span");label.textContent=folder;
  const count=document.createElement("span");count.className="count";count.textContent=items.length+" item"+(items.length===1?"":"s");summary.append(label,count);details.append(summary);
  const body=document.createElement("div");body.className="group-body";
  for(const f of items){
   const row=document.createElement("div");row.className="item";const left=document.createElement("div");left.className="item-name";
   const name=document.createElement("strong");name.textContent=f.name;const meta=document.createElement("div");const small=document.createElement("small");small.textContent=(f.ok?"Ready":"Incomplete")+" · "+formatSize(f.size);meta.append(small);left.append(name,meta);
   const actions=document.createElement("div");actions.className="item-actions";
   const play=document.createElement("button");play.textContent="Play";play.disabled=!f.ok||!isVideo(f);play.title=isVideo(f)?"Play video":"Not a video file";play.onclick=()=>{playQueue=allItems.filter(x=>x.ok&&isVideo(x));const idx=playQueue.findIndex(x=>x.id===f.id);playAt(idx)};
   const download=document.createElement("button");download.className="secondary";download.textContent="Save";download.disabled=!f.ok;download.onclick=()=>{const a=document.createElement("a");a.href=auth("/api/stream/"+encodeURIComponent(f.id)+"?dl=1");a.download=f.name;document.body.append(a);a.click();a.remove()};
   actions.append(play,download);row.append(left,actions);body.append(row)
  }
  details.append(body);$("items").append(details)
 }
}
async function load(){
 if(loading)return;loading=true;
 try{
  const data=await(await api(auth("/api/library"))).json();allItems=Array.isArray(data)?data:(data.items||[]);render();
  if(data.scanning){say("Loading the rest of your library in the background · "+allItems.length+" found so far.");}
  else{say("Vault ready · "+allItems.length+" files loaded.");if(pollTimer){clearInterval(pollTimer);pollTimer=null;}}
  if(data.error)say("Library scan paused: "+data.error+" · Refresh to retry.");
 }catch(e){say(e.message)}finally{loading=false}
}
$("unlock").onclick=async()=>{
 try{loginSay("Checking password…");$("unlock").disabled=true;
  const r=await api("/api/unlock",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({p:$("password").value})});
  token=(await r.json()).t;$("login").classList.add("hidden");$("app").classList.remove("hidden");await load();
  if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(()=>load(),3000);
 }catch(e){loginSay(e.message)}finally{$("unlock").disabled=false}
};
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")$("unlock").click()});
$("refresh").onclick=()=>load();$("search").addEventListener("input",render);
$("previous").onclick=()=>moveQueue(-1);$("next").onclick=()=>moveQueue(1);
const vid=$("video");
$("playPause").onclick=()=>vid.paused?vid.play():vid.pause();
vid.onclick=()=>vid.paused?vid.play():vid.pause();
vid.addEventListener("play",syncControls);vid.addEventListener("pause",syncControls);
vid.addEventListener("timeupdate",syncControls);vid.addEventListener("durationchange",syncControls);
$("seek").oninput=()=>{if(vid.duration)vid.currentTime=Number($("seek").value)/1000*vid.duration};
$("mute").onclick=()=>{vid.muted=!vid.muted;syncControls()};
$("volume").oninput=()=>{vid.volume=Number($("volume").value);vid.muted=vid.volume===0;syncControls()};
$("captions").onchange=()=>setSubtitle($("captions").value);
$("fullscreen").onclick=()=>{const p=$("player");if(document.fullscreenElement)document.exitFullscreen();else if(p.requestFullscreen)p.requestFullscreen()};
$("video").addEventListener("ended",()=>moveQueue(1));
$("speed").onchange=()=>{vid.playbackRate=Number($("speed").value)};
$("lock").onclick=async()=>{
 try{await api(auth("/api/lock"),{method:"POST"})}catch(e){}
 token="";if(pollTimer)clearInterval(pollTimer);pollTimer=null;
 $("video").pause();$("video").removeAttribute("src");$("video").querySelectorAll("track").forEach(t=>t.remove());$("video").load();$("captions").innerHTML='<option value="">Off</option>';
 allItems=[];playQueue=[];currentIndex=-1;$("app").classList.add("hidden");$("login").classList.remove("hidden");$("password").value="";loginSay("Vault locked.")
};
$("upload").onclick=async()=>{
 const selected=[...$("files").files,...$("folders").files];const fs=[...new Map(selected.map(f=>[f.name+"|"+f.size+"|"+(f.webkitRelativePath||""),f])).values()];
 if(!fs.length){say("Choose files or a folder first.");return}
 try{
  for(let fi=0;fi<fs.length;fi++){
   const f=fs[fi],relative=f.webkitRelativePath||"",folder=relative.includes("/")?relative.slice(0,relative.lastIndexOf("/")):"";
   say("Uploading "+(relative||f.name)+" ("+(fi+1)+"/"+fs.length+")…");
   const start=await(await api(auth("/api/upload/start"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:f.name,folder:folder,size:f.size,type:f.type})})).json();
   for(let i=0;i<start.n;i++){
    const chunk=f.slice(i*start.chunk,Math.min(f.size,(i+1)*start.chunk));await api(auth("/api/upload/chunk?id="+encodeURIComponent(start.id)+"&i="+i),{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:await chunk.arrayBuffer()});
    say("Uploading "+f.name+": "+Math.round((i+1)/start.n*100)+"% · file "+(fi+1)+"/"+fs.length)
   }
  }
  $("files").value="";$("folders").value="";await load();say("Upload complete. Folder structure has been saved.")
 }catch(e){say("Upload stopped: "+e.message)}
};
$("video").addEventListener("error",()=>{if($("video").currentSrc)say("The video could not be decoded by this browser. Try another supported video format.")});
</script></body></html>
